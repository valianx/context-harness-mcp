name: CI

# Run on every pull request. Never on push to main — deploy.yml owns that.
on:
  pull_request:

jobs:
  lint-and-build:
    name: Lint and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: go vet
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.6.1

      - name: staticcheck
        run: staticcheck ./...

      - name: go build
        run: go build ./...

      # go test is added in PR-2 once migrations + docker-compose integration
      # tests are in place. The full ci.yml with docker-compose wiring lands in PR-6.
