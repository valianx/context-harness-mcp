name: CI

# Run on every pull request. Never on push to main — deploy.yml owns that.
on:
  pull_request:

jobs:
  lint-and-build:
    name: Lint, build, and unit tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # testcontainers-go spins its own ephemeral Postgres inside Docker, so
      # DATABASE_URL is needed only when a test explicitly reads it. The
      # service container above is present for any future tests that prefer
      # a pre-migrated DB over testcontainers.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      # Install the ONNX Runtime C++ shared library that fastembed-go links
      # against via CGO. The version must match Dockerfile's ONNX_RUNTIME_VERSION
      # so CI exercises the same embedder path as production. Without this,
      # every write-path test that depends on the embedder silently skips via
      # requireEmbedder() and the CI green is misleading.
      - name: Install ONNX Runtime
        env:
          ONNX_RUNTIME_VERSION: "1.20.0"
        run: |
          curl -fsSL "https://github.com/microsoft/onnxruntime/releases/download/v${ONNX_RUNTIME_VERSION}/onnxruntime-linux-x64-${ONNX_RUNTIME_VERSION}.tgz" -o /tmp/onnx.tgz
          sudo tar -xzf /tmp/onnx.tgz -C /usr/local --strip-components=1
          sudo ldconfig
          echo "LD_LIBRARY_PATH=/usr/local/lib" >> "$GITHUB_ENV"

      - name: go vet
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.6.1

      - name: staticcheck
        run: staticcheck ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...

  e2e-smoke:
    name: E2E smoke tests (docker compose + pgvector)
    runs-on: ubuntu-latest
    # Runs in parallel with lint-and-build — each job is independent.

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.26.0

      - name: Apply migrations against service-container Postgres
        # Runs from the host; the mcp container later connects via host.docker.internal.
        run: goose -dir migrations postgres "postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable" up

      - name: Write docker-compose.override.yml
        # On ubuntu-latest runners, the GH Actions service container is reachable
        # from inside a docker-compose container via host.docker.internal when
        # extra_hosts is set to host-gateway. The override file is written before
        # `docker compose up` so the extra_hosts entry is present at container creation.
        run: |
          printf 'services:\n  mcp:\n    extra_hosts:\n      - "host.docker.internal:host-gateway"\n' \
            > docker-compose.override.yml

      - name: Start mcp service and wait for healthy
        # The healthcheck in docker-compose.yml (curl -fsSL http://localhost:7654/healthz)
        # must pass before --wait returns. DATABASE_URL points the mcp container at
        # the host's service-container Postgres via host.docker.internal.
        env:
          DATABASE_URL: postgres://postgres:postgres@host.docker.internal:5432/postgres?sslmode=disable
        run: docker compose up -d --wait mcp

      - name: Smoke test — happy path
        env:
          MCP_URL: http://localhost:7654/mcp
        run: bash scripts/smoke/happy_path.sh

      - name: Smoke test — secret rejected
        env:
          MCP_URL: http://localhost:7654/mcp
        run: bash scripts/smoke/secret_rejected.sh

      - name: Smoke test — size rejected
        env:
          MCP_URL: http://localhost:7654/mcp
        run: bash scripts/smoke/size_rejected.sh

      - name: Tear down
        if: always()
        env:
          DATABASE_URL: postgres://postgres:postgres@host.docker.internal:5432/postgres?sslmode=disable
        run: docker compose down
