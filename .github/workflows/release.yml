# release.yml — Build and publish the Docker image to GitHub Container Registry.
#
# Triggered on every semver tag push (e.g. v1.0.0) and via workflow_dispatch
# for manual re-runs. No PAT or manually configured secret is required —
# the workflow uses the GITHUB_TOKEN that GitHub injects automatically into
# every workflow run.
#
# The image is published to ghcr.io/valianx/context-harness-mcp with four
# tags derived by docker/metadata-action: the full semver (1.0.0), the minor
# prefix (1.0), the major prefix (1), and `latest`.
#
# Single-arch linux/amd64 only — the ONNX Runtime CGO build is amd64.

name: Release — publish Docker image to ghcr.io

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          provenance: false
