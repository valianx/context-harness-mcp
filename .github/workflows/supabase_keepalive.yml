name: Supabase keepalive

on:
  schedule:
    # Every 6 days at 12:00 UTC. Supabase Free auto-pauses after 7 days of DB
    # inactivity; the 1-day buffer prevents unplanned pauses between cron fires.
    - cron: "0 12 */6 * *"
  workflow_dispatch:

jobs:
  ping:
    name: SELECT 1 against database
    runs-on: ubuntu-latest

    env:
      # Prefer DATABASE_URL if the operator has already renamed the secret;
      # fall back to SUPABASE_DB_URL so existing deployments keep working until
      # the operator renames their GH secret. An unset GH secret resolves to an
      # empty string, not an error.
      DATABASE_URL: ${{ secrets.DATABASE_URL != '' && secrets.DATABASE_URL || secrets.SUPABASE_DB_URL }}

    steps:
      - name: Guard — secret must be set
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::keepalive skipped — DATABASE_URL not yet configured."
            exit 0
          fi

      - name: Install psql
        if: ${{ env.DATABASE_URL != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16

      - name: Run SELECT 1
        if: ${{ env.DATABASE_URL != '' }}
        run: |
          output=$(psql "$DATABASE_URL" -tAc 'select 1')
          if [ "$output" != "1" ]; then
            echo "::error::keepalive query did not return 1; got '$output'"
            exit 1
          fi
          echo "keepalive OK"
