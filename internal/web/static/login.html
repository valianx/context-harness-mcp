<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Context Harness MCP — Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0f0f12;
      --surface: #1a1a22;
      --border:  #2a2a38;
      --text:    #e2e2ef;
      --muted:   #8888aa;
      --accent:  #6c6cf0;
      --error:   #f07070;
      --success: #4dd898;
      --radius:  8px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: ui-monospace, "Cascadia Code", "Fira Code", monospace;
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .muted { color: var(--muted); font-size: 12px; margin-bottom: 32px; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      width: 100%;
      max-width: 400px;
    }

    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }

    input[type="email"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      padding: 8px 10px;
      outline: none;
      margin-bottom: 14px;
    }
    input[type="email"]:focus { border-color: var(--accent); }

    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 4px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      padding: 9px 18px;
      cursor: pointer;
      width: 100%;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .error-msg { color: var(--error); font-size: 13px; margin-top: 10px; display: none; }
    .success-msg { color: var(--success); font-size: 13px; margin-top: 10px; display: none; }
    .note { color: var(--muted); font-size: 11px; margin-top: 14px; }
  </style>
</head>
<body>
  <h1>Context Harness MCP</h1>
  <p class="muted">Enter your email to receive a login link</p>

  <div class="card">
    <label for="email">Email address</label>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
    <button id="btn-send">Send login link</button>
    <p id="error-msg" class="error-msg"></p>
    <p id="success-msg" class="success-msg">
      Check your inbox for a login link. It will redirect you back here to complete authentication.
    </p>
    <p class="note">
      Your email must be invited by an admin before you can log in.
      Contact your MCP server administrator if you haven't received an invite.
    </p>
  </div>

  <script>
    // Server-rendered constants injected at boot time by Go html/template.
    const SUPABASE_URL  = "{{.SupabaseProjectURL}}";
    const SUPABASE_ANON = "{{.SupabaseAnonKey}}";
    const MCP_ORIGIN    = "{{.MCPPublicURL}}";

    const emailEl   = document.getElementById("email");
    const btn       = document.getElementById("btn-send");
    const errorMsg  = document.getElementById("error-msg");
    const successMsg = document.getElementById("success-msg");

    // Redirect URL for the magic link — Supabase will append #access_token=...
    const redirectTo = MCP_ORIGIN ? `${MCP_ORIGIN}/auth/callback` : `${window.location.origin}/auth/callback`;

    async function sendLink() {
      errorMsg.style.display   = "none";
      successMsg.style.display = "none";

      const email = emailEl.value.trim();
      if (!email.includes("@")) {
        errorMsg.textContent = "Please enter a valid email address.";
        errorMsg.style.display = "block";
        return;
      }

      btn.disabled = true;

      try {
        const res = await fetch(`${SUPABASE_URL}/auth/v1/recover`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_ANON,
          },
          body: JSON.stringify({ email, redirect_to: redirectTo }),
        });

        // Supabase returns 200 regardless of whether the email exists (privacy).
        // Only surface a real error if the status is unexpected.
        if (!res.ok && res.status !== 200) {
          const body = await res.json().catch(() => ({}));
          throw new Error(body.error_description || body.msg || `Request failed (${res.status})`);
        }

        successMsg.style.display = "block";
      } catch (e) {
        errorMsg.textContent = e.message;
        errorMsg.style.display = "block";
        btn.disabled = false;
      }
    }

    btn.addEventListener("click", sendLink);

    emailEl.addEventListener("keydown", e => {
      if (e.key === "Enter") btn.click();
    });
  </script>
</body>
</html>
