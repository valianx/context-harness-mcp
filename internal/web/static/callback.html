<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>context-harness — set up access</title>
<style>
  :root{
    --ch-bg:#0a0a0d; --ch-bg-panel:#14141a; --ch-bg-code:#050507;
    --ch-fg:#e6e6ea; --ch-fg-mute:#8a8a96; --ch-fg-dim:#56565f;
    --ch-border:#1f1f27; --ch-accent:#f59e0b; --ch-accent-soft:#f59e0b22;
    --ch-error:#ef4444;
    --ch-sans:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
    --ch-mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--ch-bg);color:var(--ch-fg);font-family:var(--ch-sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;flex-direction:column;position:relative;overflow-x:hidden}
  /* ── background lattice ─────────────────────── */
  .ch-lattice{position:fixed;inset:auto 0 0 0;height:60vh;width:100%;pointer-events:none;opacity:.06;z-index:0;color:var(--ch-fg)}
  /* ── header ─────────────────────────────────── */
  .ch-header{position:relative;z-index:2;display:flex;align-items:center;gap:12px;padding:28px 32px;color:var(--ch-fg-mute)}
  .ch-mark{color:var(--ch-fg);height:22px;width:22px;display:block;flex:0 0 auto}
  .ch-wordmark{font-family:var(--ch-mono);font-size:12px;letter-spacing:.02em;color:var(--ch-fg-mute)}
  .ch-home-link{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;border-radius:4px;padding:2px 4px;margin:-2px -4px;transition:background 150ms ease}
  .ch-home-link:hover{background:var(--ch-bg-panel)}
  /* ── shell ──────────────────────────────────── */
  main{position:relative;z-index:1;flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
  .ch-panel{width:100%;max-width:440px;background:var(--ch-bg-panel);border:1px solid var(--ch-border);border-radius:10px;padding:32px}
  .ch-title{font-size:24px;line-height:1.25;font-weight:500;margin:0 0 6px;letter-spacing:-.01em}
  .ch-sub{color:var(--ch-fg-mute);font-size:13px;margin:0 0 24px}
  /* ── form ───────────────────────────────────── */
  .ch-field{margin-bottom:14px}
  .ch-label{display:block;font-family:var(--ch-mono);font-size:11px;color:var(--ch-fg-mute);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
  .ch-input{width:100%;background:var(--ch-bg);color:var(--ch-fg);border:1px solid var(--ch-border);border-radius:6px;padding:10px 12px;font:400 14px/1.4 var(--ch-sans);outline:none;transition:border-color 150ms ease}
  .ch-input::placeholder{color:var(--ch-fg-mute)}
  .ch-input:focus{border-bottom-color:var(--ch-accent)}
  .ch-input:focus-visible{outline:2px solid var(--ch-accent-soft);outline-offset:1px}
  .ch-help{font-size:12px;color:var(--ch-fg-dim);margin:8px 0 0}
  /* ── buttons ────────────────────────────────── */
  .ch-btn-primary,.ch-btn-secondary{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 18px;border-radius:6px;font:500 14px/1 var(--ch-sans);cursor:pointer;border:1px solid transparent;transition:all 150ms ease;text-decoration:none;width:100%}
  .ch-btn-primary{background:var(--ch-accent);color:#0a0a0d}
  .ch-btn-primary:hover:not(:disabled){box-shadow:0 0 0 4px var(--ch-accent-soft)}
  .ch-btn-primary:disabled{opacity:.55;cursor:default}
  .ch-btn-secondary{background:transparent;color:var(--ch-accent);border-color:var(--ch-accent)}
  .ch-btn-secondary:hover{background:var(--ch-accent-soft)}
  /* ── code block ─────────────────────────────── */
  .ch-code{position:relative;background:var(--ch-bg-code);border:1px solid var(--ch-border);border-radius:8px;padding:16px 16px 16px 18px;font:400 13px/1.55 var(--ch-mono);color:var(--ch-fg);overflow-x:auto;white-space:pre}
  .ch-code-copy{position:absolute;top:8px;right:8px;background:transparent;border:0;color:var(--ch-fg-mute);cursor:pointer;padding:6px 8px;border-radius:4px;display:inline-flex;align-items:center;gap:6px;font:500 12px/1 var(--ch-sans);transition:color 150ms ease,background 150ms ease}
  .ch-code-copy:hover{color:var(--ch-accent);background:#0a0a0d}
  .ch-code-copy svg{width:13px;height:13px;display:block}
  /* ── spinner ────────────────────────────────── */
  .ch-spinner{width:14px;height:14px;border:1.5px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:ch-spin .8s linear infinite}
  @keyframes ch-spin{to{transform:rotate(360deg)}}
  /* ── error ──────────────────────────────────── */
  .ch-error{color:var(--ch-error);font-size:13px;margin:0 0 14px;padding:10px 12px;background:#ef444411;border:1px solid #ef444433;border-radius:6px;font-family:var(--ch-mono)}
  /* ── states / entrance ──────────────────────── */
  .ch-state{animation:ch-in 200ms ease-out both}
  @keyframes ch-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  [hidden]{display:none!important}
  /* ── toast ──────────────────────────────────── */
  .ch-toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:var(--ch-bg-panel);border:1px solid var(--ch-border);color:var(--ch-fg);padding:9px 16px;border-radius:6px;font:500 13px/1 var(--ch-sans);z-index:10;animation:ch-toast 1500ms ease-out forwards;pointer-events:none}
  @keyframes ch-toast{
    0%{opacity:0;transform:translate(-50%,8px)}
    15%,75%{opacity:1;transform:translate(-50%,0)}
    100%{opacity:0;transform:translate(-50%,-4px)}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  }
</style>
</head>
<body>

<!-- background motif: same node-graph atoms, scaled out into a lattice -->
<svg class="ch-lattice" aria-hidden="true" preserveAspectRatio="xMidYMax slice" viewBox="0 0 1600 1000">
  <g fill="currentColor" opacity=".75">
    <circle cx="120"  cy="80"   r="1"/><circle cx="240"  cy="180"  r="1.2"/>
    <circle cx="380"  cy="60"   r="0.8"/><circle cx="520"  cy="220"  r="1"/>
    <circle cx="680"  cy="120"  r="1.4"/><circle cx="840"  cy="280"  r="1"/>
    <circle cx="1000" cy="80"   r="0.9"/><circle cx="1180" cy="200"  r="1.1"/>
    <circle cx="1340" cy="100"  r="1"/><circle cx="1500" cy="240"  r="0.8"/>
    <circle cx="80"   cy="380"  r="1"/><circle cx="260"  cy="520"  r="1.3"/>
    <circle cx="440"  cy="420"  r="0.9"/><circle cx="620"  cy="600"  r="1"/>
    <circle cx="820"  cy="480"  r="1.4"/><circle cx="1020" cy="640"  r="1"/>
    <circle cx="1200" cy="520"  r="1.1"/><circle cx="1380" cy="680"  r="0.9"/>
    <circle cx="1540" cy="580"  r="1"/><circle cx="60"   cy="780"  r="1.2"/>
    <circle cx="220"  cy="900"  r="1"/><circle cx="400"  cy="820"  r="0.8"/>
    <circle cx="580"  cy="940"  r="1.1"/><circle cx="760"  cy="780"  r="1"/>
    <circle cx="940"  cy="900"  r="1.3"/><circle cx="1140" cy="820"  r="0.9"/>
    <circle cx="1320" cy="940"  r="1"/><circle cx="1480" cy="860"  r="1.1"/>
  </g>
  <g fill="#f59e0b" opacity=".9">
    <circle cx="380"  cy="540"  r="2.4"/>
    <circle cx="1100" cy="340"  r="2.4"/>
  </g>
  <g stroke="currentColor" stroke-width=".5" stroke-dasharray="3 5" fill="none" opacity=".5">
    <line x1="380"  y1="540"  x2="1100" y2="340"/>
    <line x1="120"  y1="80"   x2="380"  y2="540"/>
    <line x1="1100" y1="340"  x2="1540" y2="580"/>
    <line x1="220"  y1="900"  x2="380"  y2="540"/>
    <line x1="1100" y1="340"  x2="680"  y2="120"/>
  </g>
</svg>

<header class="ch-header">
  <a class="ch-home-link" href="/" aria-label="home">
  <svg class="ch-mark" viewBox="0 0 32 32" role="img" aria-label="context-harness mark" xmlns="http://www.w3.org/2000/svg">
    <g fill="none" stroke="currentColor" stroke-width="0.8" opacity=".85">
      <circle cx="16" cy="16" r="13"/>
      <ellipse cx="16" cy="16" rx="13" ry="4.5"/>
      <ellipse cx="16" cy="16" rx="13" ry="4.5" transform="rotate(60 16 16)"/>
      <ellipse cx="16" cy="16" rx="13" ry="4.5" transform="rotate(-60 16 16)"/>
    </g>
    <g fill="currentColor">
      <circle cx="3" cy="16" r="1.1"/>
      <circle cx="29" cy="16" r="1.1"/>
      <circle cx="9.5" cy="4.74" r="1.1"/>
      <circle cx="22.5" cy="4.74" r="1.1"/>
      <circle cx="9.5" cy="27.26" r="1.1"/>
      <circle cx="22.5" cy="27.26" r="1.1"/>
    </g>
    <circle cx="16" cy="16" r="2.8" fill="#f59e0b">
      <animate attributeName="r" values="2.8;3.4;2.8" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="1" fill="#a78bfa" opacity="0">
      <animateMotion path="M3,16 L29,16" dur="2.4s" repeatCount="indefinite" begin="0s"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite" begin="0s"/>
    </circle>
    <circle r="1" fill="#a78bfa" opacity="0">
      <animateMotion path="M9.5,4.74 L22.5,27.26" dur="2.4s" repeatCount="indefinite" begin="0.8s"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite" begin="0.8s"/>
    </circle>
    <circle r="1" fill="#a78bfa" opacity="0">
      <animateMotion path="M22.5,4.74 L9.5,27.26" dur="2.4s" repeatCount="indefinite" begin="1.6s"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite" begin="1.6s"/>
    </circle>
  </svg>
  <span class="ch-wordmark">context-harness</span>
  </a>
</header>

<main>

  <!-- ── 1. LOADING ─────────────────────────────────────────── -->
  <section class="ch-panel ch-state" id="view-loading" aria-live="polite">
    <div style="display:flex;align-items:center;gap:10px;color:var(--ch-fg-mute);font-family:var(--ch-mono);font-size:13px">
      <span class="ch-spinner" style="color:var(--ch-accent)"></span>
      parsing token…
    </div>
  </section>

  <!-- ── 2. SET PASSWORD ────────────────────────────────────── -->
  <section class="ch-panel ch-state" id="view-form" hidden>
    <h1 class="ch-title">Set your access password</h1>
    <p class="ch-sub">One-time setup. You'll use this if your bearer ever expires.</p>
    <div class="ch-error" id="form-error" hidden></div>
    <form id="setpw-form" novalidate>
      <div class="ch-field">
        <label class="ch-label" for="pw">password</label>
        <input class="ch-input" type="password" id="pw" name="pw" autocomplete="new-password" required minlength="8" placeholder="min. 8 characters"/>
      </div>
      <div class="ch-field">
        <label class="ch-label" for="pw2">confirm</label>
        <input class="ch-input" type="password" id="pw2" name="pw2" autocomplete="new-password" required minlength="8" placeholder="retype"/>
      </div>
      <button class="ch-btn-primary" type="submit" id="setpw-submit">
        <span id="setpw-label">Continue</span>
      </button>
    </form>
  </section>

  <!-- ── 3. ERROR ───────────────────────────────────────────── -->
  <section class="ch-panel ch-state" id="view-error" hidden>
    <h1 class="ch-title" style="color:var(--ch-error)">Something broke</h1>
    <p class="ch-sub" id="error-detail">Token missing or invalid.</p>
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:16px">
      <a class="ch-btn-secondary" href="#" onclick="location.reload();return false">Try again</a>
      <a class="ch-btn-secondary" href="/">Back to home</a>
    </div>
  </section>

</main>

<script>
(() => {
  // ── template variables injected server-side ─────────────────
  const SUPABASE_PROJECT_URL = "{{.SupabaseProjectURL}}";
  const SUPABASE_ANON_KEY    = "{{.SupabaseAnonKey}}";
  const MCP_PUBLIC_URL       = "{{.MCPPublicURL}}";

  // ── view switching ──────────────────────────────────────────
  const views = ['loading','form','error'];
  function show(name){
    views.forEach(v => {
      const el = document.getElementById('view-'+v);
      el.hidden = v !== name;
      if(v===name){ el.classList.remove('ch-state'); void el.offsetWidth; el.classList.add('ch-state'); }
    });
  }
  function showError(msg){
    document.getElementById('error-detail').textContent = msg || 'Token missing or invalid.';
    show('error');
  }
  function formError(msg){
    const el = document.getElementById('form-error');
    el.textContent = msg;
    el.hidden = false;
  }

  // ── parse fragment and query string ────────────────────────
  const frag = window.location.hash.replace(/^#/,'');
  const params = new URLSearchParams(frag);
  const accessToken = params.get('access_token');
  const type = params.get('type');
  // next= from the query string is forwarded to /auth/exchange so the server
  // can validate it and echo a safe redirect_to (AC-7). Never trust client-side.
  const nextParam = new URLSearchParams(window.location.search).get('next') || '';

  setTimeout(() => {
    if(!accessToken || !['invite','recovery'].includes(type||'')){
      showError('Missing or invalid token. Request a new link.');
      return;
    }
    show('form');
  }, 200);

  // ── form submit ─────────────────────────────────────────────
  document.getElementById('setpw-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw  = document.getElementById('pw').value;
    const pw2 = document.getElementById('pw2').value;
    document.getElementById('form-error').hidden = true;
    if(pw.length < 8) return formError('Password must be at least 8 characters.');
    if(pw !== pw2)    return formError('Passwords don\u2019t match.');

    const submit = document.getElementById('setpw-submit');
    const label  = document.getElementById('setpw-label');
    submit.disabled = true;
    label.innerHTML = '<span class="ch-spinner" style="color:#0a0a0d"></span>';

    try{
      // 1. set password via IdP
      const r1 = await fetch(`${SUPABASE_PROJECT_URL}/auth/v1/user`, {
        method:'PUT',
        headers:{
          'Authorization':`Bearer ${accessToken}`,
          'apikey':SUPABASE_ANON_KEY,
          'Content-Type':'application/json'
        },
        body: JSON.stringify({ password: pw })
      });
      if(!r1.ok){
        const err = await r1.json().catch(() => ({}));
        throw new Error(err.msg || err.error_description || `set-password failed (${r1.status})`);
      }
      // 2. exchange for server bearer + session cookie.
      // Include next so the server can validate it and echo a safe redirect_to.
      const exchangeBody = { access_token: accessToken };
      if(nextParam){ exchangeBody.next = nextParam; }
      const r2 = await fetch('/auth/exchange', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(exchangeBody)
      });
      if(!r2.ok){
        const err = await r2.json().catch(() => ({}));
        throw new Error(err.error || `exchange failed (${r2.status})`);
      }
      const { redirect_to } = await r2.json();
      // The server validates redirect_to before echoing it — trust it directly (AC-7).
      window.location.replace(redirect_to || '/dashboard');
    } catch(err){
      submit.disabled = false;
      label.textContent = 'Continue';
      formError(err.message || 'Request failed.');
    }
  });

})();
</script>
</body>
</html>
