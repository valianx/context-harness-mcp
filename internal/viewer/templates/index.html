<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>context-harness — knowledge graph</title>
<style>
  :root{
    --ch-bg:#0a0a0d; --ch-bg-panel:#14141a; --ch-bg-code:#050507;
    --ch-fg:#e6e6ea; --ch-fg-mute:#8a8a96; --ch-fg-dim:#56565f;
    --ch-border:#1f1f27; --ch-accent:#f59e0b; --ch-accent-soft:#f59e0b22;
    --ch-error:#ef4444;
    /* amber-accent alias for relation links */
    --amber-accent:#f59e0b;
    /* violet-signal alias for superseded badge */
    --violet-signal:#a78bfa;
    --violet-signal-soft:#a78bfa22;
    --ch-sans:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
    --ch-mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--ch-bg);color:var(--ch-fg);font-family:var(--ch-sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;flex-direction:column}

  /* ── header ─────────────────────────────────── */
  .ch-topbar{position:sticky;top:0;z-index:5;background:rgba(10,10,13,.92);backdrop-filter:saturate(140%) blur(8px);border-bottom:1px solid var(--ch-border);display:flex;align-items:center;gap:18px;padding:14px 24px;flex-wrap:wrap}
  .ch-mark{color:var(--ch-fg);height:22px;width:22px;display:block;flex:0 0 auto}
  .ch-wordmark{font-family:var(--ch-mono);font-size:12px;letter-spacing:.02em;color:var(--ch-fg-mute);flex:0 0 auto}
  .ch-home-link{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;border-radius:4px;padding:2px 4px;margin:-2px -4px;transition:background 150ms ease;flex:0 0 auto}
  .ch-home-link:hover{background:var(--ch-bg-panel)}
  .ch-home-link:hover .ch-wordmark{color:var(--ch-fg)}
  .ch-sep{flex:0 0 auto;color:var(--ch-fg-dim);font-family:var(--ch-mono);font-size:11px;letter-spacing:.04em}
  .ch-stat{flex:0 0 auto;display:flex;align-items:center;gap:6px;font-family:var(--ch-mono);font-size:11px;color:var(--ch-fg-mute);letter-spacing:.04em;text-transform:uppercase}
  .ch-stat-val{color:var(--ch-accent)}
  .ch-spacer{flex:1}

  /* ── controls row ───────────────────────────── */
  .ch-controls{display:flex;align-items:center;gap:10px;flex:0 1 auto}

  /* ── shared filter select style ─────────────── */
  .ch-filter-select{
    background:var(--ch-bg-panel);
    color:var(--ch-fg-mute);
    border:1px solid var(--ch-border);
    border-radius:6px;
    padding:8px 10px;
    font:400 12px/1.4 var(--ch-mono);
    outline:none;
    cursor:pointer;
    transition:border-color 150ms ease;
    height:36px;
  }
  .ch-filter-select:focus{border-color:var(--ch-accent);color:var(--ch-fg)}
  .ch-filter-select option{background:var(--ch-bg-panel);color:var(--ch-fg)}

  /* ── project select (legacy alias) ─────────────── */
  .ch-project-filter{
    background:var(--ch-bg-panel);
    color:var(--ch-fg);
    border:1px solid var(--ch-border);
    border-radius:6px;
    padding:8px 10px;
    font:400 12px/1.4 var(--ch-mono);
    outline:none;
    cursor:pointer;
    /* WCAG AA: #8a8a96 on #14141a — contrast ratio ≈6.5:1 */
    color:var(--ch-fg-mute);
    transition:border-color 150ms ease;
    height:36px;
  }
  .ch-project-filter:focus{border-color:var(--ch-accent);color:var(--ch-fg)}
  .ch-project-filter option{background:var(--ch-bg-panel);color:var(--ch-fg)}

  /* ── search ─────────────────────────────────── */
  .ch-search-wrap{position:relative;flex:0 1 340px;min-width:180px}
  .ch-search{width:100%;background:var(--ch-bg-panel);color:var(--ch-fg);border:1px solid var(--ch-border);border-radius:6px;padding:8px 12px 8px 32px;font:400 13px/1.4 var(--ch-mono);outline:none;transition:border-color 150ms ease}
  .ch-search::placeholder{color:var(--ch-fg-mute)}
  .ch-search:focus{border-bottom-color:var(--ch-accent)}
  .ch-search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--ch-fg-mute);pointer-events:none}
  .ch-kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font:500 10px/1 var(--ch-mono);color:var(--ch-fg-dim);background:var(--ch-bg);border:1px solid var(--ch-border);border-radius:3px;padding:3px 5px;pointer-events:none}

  /* ── main ───────────────────────────────────── */
  main{flex:1;padding:24px;max-width:1100px;width:100%;margin:0 auto}
  .ch-listmeta{display:flex;align-items:center;gap:12px;margin:4px 0 16px;color:var(--ch-fg-mute);font-family:var(--ch-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
  .ch-listmeta .ch-dot{width:4px;height:4px;border-radius:50%;background:var(--ch-fg-dim)}

  /* ── card ───────────────────────────────────── */
  .ch-grid{display:grid;grid-template-columns:1fr;gap:8px}
  .ch-card{position:relative;background:var(--ch-bg-panel);border:1px solid var(--ch-border);border-radius:8px;padding:16px 18px;cursor:pointer;transition:border-color 150ms ease,background 150ms ease;display:block;text-align:left;width:100%;color:inherit;font:inherit}
  .ch-card:hover{border-color:#f59e0b66}
  .ch-card:focus-visible{outline:2px solid var(--ch-accent);outline-offset:1px}
  .ch-card-head{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap;padding-right:60px}

  /* ── score badge ────────────────────────────── */
  .ch-score-badge{position:absolute;top:10px;right:12px;font-family:var(--ch-mono);font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;letter-spacing:0.3px;border:1px solid currentColor}
  .ch-score-high{background:rgba(77,216,152,.12);color:#4dd898}
  .ch-score-mid{background:rgba(245,197,96,.12);color:#f5c560}
  .ch-score-low{background:rgba(248,113,113,.12);color:#f87171}
  .ch-card-name{font-family:var(--ch-mono);font-size:14px;color:var(--ch-fg);font-weight:500;letter-spacing:-.005em}
  /* nodeType badge — amber accent */
  .ch-badge{font-family:var(--ch-mono);font-size:10px;color:var(--ch-accent);background:var(--ch-accent-soft);padding:3px 7px;border-radius:4px;letter-spacing:.06em;text-transform:uppercase}
  /* project badge — muted grey, WCAG AA (≥4.5:1): #c8c8d0 on #1a1a22 ≈8:1 */
  .ch-badge-project{font-family:var(--ch-mono);font-size:10px;color:#c8c8d0;background:#1a1a22;border:1px solid var(--ch-border);padding:2px 6px;border-radius:4px;letter-spacing:.04em}
  /* superseded badge — violet signal, WCAG AA: #c4b5fd on #1a1624 ≈6.2:1 */
  .ch-badge-superseded{
    font-family:var(--ch-mono);font-size:10px;
    color:#c4b5fd;
    background:var(--violet-signal-soft);
    border:1px solid #a78bfa44;
    padding:2px 8px;border-radius:4px;
    letter-spacing:.04em;
    cursor:pointer;
    text-transform:uppercase;
    display:inline-flex;align-items:center;gap:4px;
  }
  .ch-badge-superseded:hover{border-color:var(--violet-signal);color:var(--violet-signal)}
  .ch-card-meta{margin-left:auto;display:flex;gap:10px;font-family:var(--ch-mono);font-size:11px;color:var(--ch-fg-dim)}
  .ch-similarity{color:var(--ch-accent)}
  .ch-card-preview{color:var(--ch-fg-mute);font-size:13px;line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}

  /* ── expanded ───────────────────────────────── */
  .ch-card.open{border-color:#f59e0b66;cursor:default}
  .ch-card.open .ch-card-preview{display:none}
  .ch-expand{margin-top:14px;padding-top:14px;border-top:1px solid var(--ch-border);animation:ch-in 200ms ease-out both}
  .ch-section-label{font-family:var(--ch-mono);font-size:11px;color:var(--ch-fg-dim);letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px}
  .ch-obs-list{margin:0 0 18px;padding:0;list-style:none}
  .ch-obs-list li{padding:8px 0;border-bottom:1px dashed var(--ch-border);font-size:13px;color:var(--ch-fg);line-height:1.55}
  .ch-obs-list li:last-child{border-bottom:0}
  .ch-rel-list{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
  .ch-rel{display:inline-flex;align-items:center;gap:6px;font-family:var(--ch-mono);font-size:12px;background:var(--ch-bg);border:1px solid var(--ch-border);border-radius:4px;padding:4px 8px;color:var(--ch-fg-mute);cursor:pointer;transition:border-color 150ms ease,color 150ms ease}
  .ch-rel:hover{border-color:var(--ch-accent);color:var(--ch-accent)}
  .ch-rel-arrow{color:var(--ch-fg-dim);font-size:10px}
  .ch-rel-kind{color:var(--ch-accent);font-size:10px;text-transform:uppercase;letter-spacing:.06em}

  /* ── relations section (new flat list below observations) ─────────────── */
  .ch-relations-section{margin-top:14px}
  .ch-relations-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
  .ch-relations-list li{display:flex;align-items:center;gap:6px;font-size:12px}
  /* relation type label: small, dim, monospace — WCAG AA #8a8a96 on #14141a ≈6.5:1 */
  .ch-link-relation{
    font-family:var(--ch-mono);font-size:11px;
    color:var(--ch-fg-mute);
    text-decoration:none;
    letter-spacing:.04em;
    cursor:default;
    white-space:nowrap;
  }
  .ch-link-relation:hover{text-decoration:underline}
  .ch-rel-sep{color:var(--ch-fg-dim);font-size:10px}
  /* target node link: amber accent — WCAG AA: #f59e0b on #14141a ≈7.2:1 */
  .ch-link-target{
    font-family:var(--ch-mono);font-size:11px;
    color:var(--amber-accent);
    text-decoration:none;
    letter-spacing:.02em;
    cursor:pointer;
  }
  .ch-link-target:hover{text-decoration:underline}
  .ch-rel-direction{color:var(--ch-fg-dim);font-size:10px;letter-spacing:.04em;font-family:var(--ch-mono)}

  /* ── states ─────────────────────────────────── */
  .ch-state{animation:ch-in 200ms ease-out both}
  @keyframes ch-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  [hidden]{display:none!important}
  .ch-spinner{width:14px;height:14px;border:1.5px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:ch-spin .8s linear infinite}
  @keyframes ch-spin{to{transform:rotate(360deg)}}
  .ch-loading-row{display:flex;align-items:center;gap:10px;color:var(--ch-fg-mute);font-family:var(--ch-mono);font-size:12px;padding:24px 0}
  .ch-loading-row .ch-spinner{color:var(--ch-accent)}

  /* ── empty ──────────────────────────────────── */
  .ch-empty{text-align:center;padding:64px 24px;color:var(--ch-fg-mute)}
  .ch-empty-graph{margin:0 auto 18px;display:block;color:var(--ch-fg-dim);opacity:.5}
  .ch-empty h2{font-family:var(--ch-sans);font-weight:500;font-size:18px;color:var(--ch-fg);margin:0 0 6px}
  .ch-empty p{margin:0;font-size:13px;color:var(--ch-fg-mute);font-family:var(--ch-mono)}

  /* ── error ──────────────────────────────────── */
  .ch-error-box{margin:0 0 14px;padding:12px 14px;background:#ef444411;border:1px solid #ef444433;color:var(--ch-error);font-family:var(--ch-mono);font-size:12px;border-radius:6px;display:flex;align-items:center;gap:10px}
  .ch-error-box button{background:transparent;border:1px solid var(--ch-error);color:var(--ch-error);font:500 11px/1 var(--ch-mono);padding:5px 10px;border-radius:4px;cursor:pointer;margin-left:auto;text-transform:uppercase;letter-spacing:.06em}
  .ch-error-box button:hover{background:#ef444422}

  /* ── footer ─────────────────────────────────── */
  footer{padding:24px;border-top:1px solid var(--ch-border);color:var(--ch-fg-dim);font-family:var(--ch-mono);font-size:11px;text-align:center;letter-spacing:.04em}

  @media (max-width:680px){
    .ch-topbar{gap:10px;padding:12px 16px}
    .ch-controls{flex:1 1 100%;order:99}
    .ch-stat{display:none}
    main{padding:16px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  }
</style>
</head>
<body>

<header class="ch-topbar">
  <a class="ch-home-link" href="/" aria-label="home">
  <svg class="ch-mark" viewBox="0 0 32 32" role="img" aria-label="context-harness mark" xmlns="http://www.w3.org/2000/svg">
    <g fill="none" stroke="currentColor" stroke-width="0.8" opacity=".85">
      <circle cx="16" cy="16" r="13"/>
      <ellipse cx="16" cy="16" rx="13" ry="4.5"/>
      <ellipse cx="16" cy="16" rx="13" ry="4.5" transform="rotate(60 16 16)"/>
      <ellipse cx="16" cy="16" rx="13" ry="4.5" transform="rotate(-60 16 16)"/>
    </g>
    <g fill="currentColor">
      <circle cx="3" cy="16" r="1.1"/>
      <circle cx="29" cy="16" r="1.1"/>
      <circle cx="9.5" cy="4.74" r="1.1"/>
      <circle cx="22.5" cy="4.74" r="1.1"/>
      <circle cx="9.5" cy="27.26" r="1.1"/>
      <circle cx="22.5" cy="27.26" r="1.1"/>
    </g>
    <circle cx="16" cy="16" r="2.8" fill="#f59e0b">
      <animate attributeName="r" values="2.8;3.4;2.8" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="1" fill="#a78bfa" opacity="0">
      <animateMotion path="M3,16 L29,16" dur="2.4s" repeatCount="indefinite" begin="0s"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite" begin="0s"/>
    </circle>
    <circle r="1" fill="#a78bfa" opacity="0">
      <animateMotion path="M9.5,4.74 L22.5,27.26" dur="2.4s" repeatCount="indefinite" begin="0.8s"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite" begin="0.8s"/>
    </circle>
    <circle r="1" fill="#a78bfa" opacity="0">
      <animateMotion path="M22.5,4.74 L9.5,27.26" dur="2.4s" repeatCount="indefinite" begin="1.6s"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite" begin="1.6s"/>
    </circle>
  </svg>
  <span class="ch-wordmark">context-harness</span>
  </a>
  <span class="ch-sep">/</span>
  <span class="ch-stat"><span class="ch-stat-val" id="stat-nodes">—</span>&nbsp;nodes</span>
  <span class="ch-stat"><span class="ch-stat-val" id="stat-obs">—</span>&nbsp;observations</span>
  <span class="ch-spacer"></span>
  <div class="ch-controls">
    <select class="ch-project-filter" id="project-filter" aria-label="filter by project">
      <option value="">all projects</option>
      <option value="global">global</option>
    </select>
    <select class="ch-filter-select" id="nodetype-filter" aria-label="filter by node type">
      <option value="">all types</option>
    </select>
    <div class="ch-search-wrap">
      <svg class="ch-search-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.4"/>
        <path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <input class="ch-search" type="search" id="search" placeholder="search nodes (min 3 chars)… leave blank to list all" autocomplete="off" aria-label="search nodes"/>
      <span class="ch-kbd">/</span>
    </div>
  </div>
</header>

<main>
  <div class="ch-listmeta" id="listmeta">
    <span id="listmeta-text">read_graph</span>
    <span class="ch-dot" aria-hidden="true"></span>
    <span id="listmeta-count">—</span>
  </div>

  <div class="ch-error-box" id="errorbox" hidden role="alert">
    <span id="errortext">Server unreachable.</span>
    <button type="button" id="errorretry">retry</button>
  </div>

  <div class="ch-loading-row ch-state" id="loadingrow"><span class="ch-spinner"></span><span>fetching graph…</span></div>

  <div class="ch-grid" id="grid" hidden></div>

  <div class="ch-empty" id="empty" hidden>
    <svg class="ch-empty-graph" width="180" height="180" viewBox="0 0 32 32" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-width="0.7" opacity=".7">
        <circle cx="16" cy="16" r="13"/>
        <ellipse cx="16" cy="16" rx="13" ry="4.5"/>
        <ellipse cx="16" cy="16" rx="13" ry="4.5" transform="rotate(60 16 16)"/>
        <ellipse cx="16" cy="16" rx="13" ry="4.5" transform="rotate(-60 16 16)"/>
      </g>
      <g fill="currentColor">
        <circle cx="3" cy="16" r="1.1"/><circle cx="29" cy="16" r="1.1"/>
        <circle cx="9.5" cy="4.74" r="1.1"/><circle cx="22.5" cy="4.74" r="1.1"/>
        <circle cx="9.5" cy="27.26" r="1.1"/><circle cx="22.5" cy="27.26" r="1.1"/>
      </g>
      <circle cx="16" cy="16" r="2.8" fill="#f59e0b"/>
      <circle cx="10" cy="16" r="0.9" fill="#a78bfa"/>
      <circle cx="22" cy="16" r="0.9" fill="#a78bfa"/>
    </svg>
    <h2>No nodes yet</h2>
    <p>call create_nodes from your client to populate the graph</p>
  </div>
</main>

<footer>
  context-harness · public read-only knowledge graph
</footer>

<script>
(() => {
  // ── config ──────────────────────────────────────────────────
  const SEARCH_API     = '/viewer/api/search';
  const PROJECTS_API   = '/viewer/api/projects';
  const NODE_TYPES_API = '/viewer/api/node-types';
  const SEARCH_DEBOUNCE_MS = 1000;  // operator must pause typing 1s before search fires

  // ── DOM refs ────────────────────────────────────────────────
  const $search    = document.getElementById('search');
  const $project   = document.getElementById('project-filter');
  const $nodetype  = document.getElementById('nodetype-filter');
  const $grid      = document.getElementById('grid');
  const $empty     = document.getElementById('empty');
  const $loading   = document.getElementById('loadingrow');
  const $errorbox  = document.getElementById('errorbox');
  const $errortext = document.getElementById('errortext');
  const $statN     = document.getElementById('stat-nodes');
  const $statO     = document.getElementById('stat-obs');
  const $meta      = document.getElementById('listmeta-text');
  const $metaCt    = document.getElementById('listmeta-count');

  let allNodes = [];

  // ── dropdown loaders ────────────────────────────────────────
  // Both fetches run in parallel on page load. Silently ignore failures —
  // static options ("all projects" / "all types") remain available.
  async function loadDropdowns() {
    const [projectRes, nodeTypeRes] = await Promise.allSettled([
      fetch(PROJECTS_API,   { headers: { 'Accept': 'application/json' } }),
      fetch(NODE_TYPES_API, { headers: { 'Accept': 'application/json' } }),
    ]);

    if (projectRes.status === 'fulfilled' && projectRes.value.ok) {
      const j = await projectRes.value.json();
      populateSelect($project, j.projects || [], 'all projects');
    }

    if (nodeTypeRes.status === 'fulfilled' && nodeTypeRes.value.ok) {
      const j = await nodeTypeRes.value.json();
      populateSelect($nodetype, j.nodeTypes || [], 'all types');
    }
  }

  // Rebuilds a <select>'s options (beyond the first "all …" option).
  function populateSelect(selectEl, values, allLabel) {
    while (selectEl.options.length > 1) {
      selectEl.remove(1);
    }
    for (const v of values) {
      const opt = document.createElement('option');
      opt.value = v;
      opt.textContent = v;
      selectEl.appendChild(opt);
    }
  }

  // ── search API client ───────────────────────────────────────
  function buildSearchURL(query) {
    const parts = [];
    if (query)             parts.push('q='        + encodeURIComponent(query));
    if ($project.value)    parts.push('project='  + encodeURIComponent($project.value));
    if ($nodetype.value)   parts.push('nodeType=' + encodeURIComponent($nodetype.value));
    return SEARCH_API + (parts.length ? '?' + parts.join('&') : '');
  }

  async function searchAPI(query) {
    const url = buildSearchURL(query);
    const r = await fetch(url, { headers: { 'Accept': 'application/json' } });
    if (!r.ok) throw new Error('search → ' + r.status);
    const j = await r.json();
    // Server returns { query, node_count, nodes: [{name, node_type, project_id,
    // observations, relations:[{from_name, to_name, relation_type}], score?}] }.
    return (j.nodes || []).map(n => ({
      name:         n.name,
      nodeType:     n.node_type,
      projectID:    n.project_id || 'global',
      observations: n.observations || [],
      relations:    n.relations    || [],
      score:        (typeof n.score === 'number') ? n.score : null,
    }));
  }

  // ── render ──────────────────────────────────────────────────
  function render(nodes, opts={}) {
    $loading.hidden = true;
    $grid.hidden = false;
    $empty.hidden = nodes.length > 0;
    if (nodes.length === 0) { $grid.hidden = true; return; }

    $metaCt.textContent = nodes.length + (opts.search ? ' match' + (nodes.length===1?'':'es') : ' node' + (nodes.length===1?'':'s'));
    $meta.textContent = opts.search ? `search_nodes("${opts.search}")` : 'read_graph';

    $grid.innerHTML = '';
    nodes.forEach((n, i) => $grid.appendChild(card(n, i, opts)));
  }

  // ── superseded indicator helper ─────────────────────────────
  // Returns the name of the node that supersedes this one, or null.
  // "supersedes" is directional: from=new → to=old. So this node is
  // superseded when there is a relation with relation_type="supersedes"
  // and to_name===this node's name.
  function supersededBy(node) {
    for (const rel of (node.relations || [])) {
      if (rel.relation_type === 'supersedes' && rel.to_name === node.name) {
        return rel.from_name;
      }
    }
    return null;
  }

  function card(node, i, opts) {
    const c = document.createElement('button');
    c.type = 'button'; c.className = 'ch-card ch-state';
    c.style.animationDelay = Math.min(i * 20, 200) + 'ms';

    const obsCount    = (node.observations || []).length;
    const previewText = (node.observations && node.observations[0]) || '—';
    const projectID   = node.projectID || 'global';
    const newNode     = supersededBy(node);

    // Build superseded badge HTML if applicable.
    const supersededBadgeHTML = newNode
      ? `<span class="ch-badge-superseded" data-target="${esc(newNode)}" role="button" tabindex="0">superseded by ${esc(newNode)}</span>`
      : '';

    // Build score badge when node.score is a number (search path only).
    let scoreBadgeHTML = '';
    if (typeof node.score === 'number') {
      const pct = Math.round(node.score * 100);
      const cls = pct >= 80 ? 'ch-score-high' : (pct >= 50 ? 'ch-score-mid' : 'ch-score-low');
      scoreBadgeHTML = `<span class="ch-score-badge ${cls}" aria-label="${pct}% match">${pct}%</span>`;
    }

    c.innerHTML = `
      ${scoreBadgeHTML}
      <div class="ch-card-head">
        ${supersededBadgeHTML}
        <span class="ch-card-name">${esc(node.name)}</span>
        <span class="ch-badge">${esc(node.nodeType || 'node')}</span>
        <span class="ch-badge-project">${esc(projectID)}</span>
        <span class="ch-card-meta">
          <span>${obsCount} obs</span>
        </span>
      </div>
      <div class="ch-card-preview">${esc(previewText)}</div>
    `;

    // Wire superseded badge click: fills search and re-searches.
    if (newNode) {
      const badge = c.querySelector('.ch-badge-superseded');
      badge.addEventListener('click', (e) => {
        e.stopPropagation();
        navigateTo(newNode);
      });
      badge.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          e.stopPropagation();
          navigateTo(newNode);
        }
      });
    }

    c.addEventListener('click', () => toggleExpand(c, node));
    return c;
  }

  // navigateTo fills the search box with name and triggers a new search.
  function navigateTo(name) {
    $search.value = name;
    runSearch();
  }

  function toggleExpand(cardEl, node) {
    if (cardEl.classList.contains('open')) {
      const exp = cardEl.querySelector('.ch-expand');
      if (exp) exp.remove();
      cardEl.classList.remove('open');
      return;
    }
    document.querySelectorAll('.ch-card.open').forEach(c => {
      c.classList.remove('open');
      const e = c.querySelector('.ch-expand'); if (e) e.remove();
    });
    cardEl.classList.add('open');
    const exp = document.createElement('div');
    exp.className = 'ch-expand';

    const obs  = node.observations || [];
    const rels = node.relations    || [];

    // Outgoing relations: where this node is the source (from_name === node.name).
    const outgoing = rels.filter(r => r.from_name === node.name);

    exp.innerHTML = `
      <p class="ch-section-label">observations · ${obs.length}</p>
      <ul class="ch-obs-list">
        ${obs.map(o => `<li>${esc(o)}</li>`).join('') || '<li style="color:var(--ch-fg-dim)">—</li>'}
      </ul>
      ${renderRelationsSection(node.name, rels)}
    `;

    cardEl.appendChild(exp);

    // Wire target-name clicks in the relations section.
    exp.querySelectorAll('.ch-link-target[data-target]').forEach(a => {
      a.addEventListener('click', (e) => {
        e.stopPropagation();
        navigateTo(a.dataset.target);
      });
    });
  }

  // renderRelationsSection builds the flat relations list HTML.
  // Each item shows: relation_type → to_name (outgoing) or from_name → (incoming).
  function renderRelationsSection(nodeName, rels) {
    if (rels.length === 0) {
      return `<div class="ch-relations-section">
        <p class="ch-section-label">relations · 0</p>
        <p style="color:var(--ch-fg-dim);font-family:var(--ch-mono);font-size:12px;margin:0">—</p>
      </div>`;
    }

    const items = rels.map(r => {
      const isOutgoing = r.from_name === nodeName;
      const direction  = isOutgoing ? '→' : '←';
      const peer       = isOutgoing ? r.to_name : r.from_name;
      return `<li>
        <span class="ch-link-relation">${esc(r.relation_type)}</span>
        <span class="ch-rel-sep">${direction}</span>
        <a class="ch-link-target" data-target="${esc(peer)}" role="button" tabindex="0">${esc(peer)}</a>
      </li>`;
    }).join('');

    return `<div class="ch-relations-section">
      <p class="ch-section-label">relations · ${rels.length}</p>
      <ul class="ch-relations-list">${items}</ul>
    </div>`;
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
  }

  function updateStats(nodes) {
    $statN.textContent = nodes.length;
    $statO.textContent = nodes.reduce((a, n) => a + (n.observations || []).length, 0);
  }

  // ── load ────────────────────────────────────────────────────
  async function load() {
    $errorbox.hidden = true; $loading.hidden = false; $grid.hidden = true; $empty.hidden = true;
    try {
      const nodes = await searchAPI('');
      allNodes = nodes;
      updateStats(allNodes);
      render(allNodes);
    } catch (err) {
      showError(err.message + ' — server may be unreachable.');
      $loading.hidden = true;
      $empty.hidden   = false;
    }
  }

  function showError(msg) {
    $errortext.textContent = msg || 'Server unreachable.';
    $errorbox.hidden = false;
  }
  document.getElementById('errorretry').addEventListener('click', load);

  // ── search ──────────────────────────────────────────────────
  let searchTimer = null;

  function scheduleSearch() {
    clearTimeout(searchTimer);
    const q = $search.value.trim();

    // Empty query: list all (existing behavior).
    if (q.length === 0) {
      $meta.textContent = '';  // no pending hint for list-all
      searchTimer = setTimeout(runSearch, SEARCH_DEBOUNCE_MS);
      return;
    }

    // 1–2 characters: show hint, clear results — do not fire the API.
    if (q.length < 3) {
      $meta.textContent    = 'type at least 3 characters to search…';
      $metaCt.textContent  = '';
      $grid.innerHTML      = '';
      $grid.hidden         = true;
      $empty.hidden        = true;
      $loading.hidden      = true;
      return;
    }

    // 3+ characters: show pending hint while debounce window is open, then search.
    $meta.textContent = 'Searching in ' + (SEARCH_DEBOUNCE_MS / 1000) + 's after you stop typing…';
    $metaCt.textContent = '';
    searchTimer = setTimeout(runSearch, SEARCH_DEBOUNCE_MS);
  }

  $search.addEventListener('input', scheduleSearch);
  $search.addEventListener('search', runSearch); // clear button (browser x icon)

  // Both filter dropdowns re-run the current search/list immediately on change.
  function onFilterChange() {
    const q = $search.value.trim();
    if (!q) {
      load();
    } else {
      runSearch();
    }
  }
  $project.addEventListener('change', onFilterChange);
  $nodetype.addEventListener('change', onFilterChange);

  async function runSearch() {
    const q = $search.value.trim();
    if (!q) { render(allNodes); return; }

    try {
      const nodes = await searchAPI(q);
      render(nodes, { search: q });
    } catch (err) {
      showError(err.message);
    }
  }

  // ── '/' to focus search ─────────────────────────────────────
  window.addEventListener('keydown', (e) => {
    if (e.key === '/' && document.activeElement !== $search && !e.metaKey && !e.ctrlKey) {
      e.preventDefault(); $search.focus();
    }
    if (e.key === 'Escape' && document.activeElement === $search) {
      $search.value = ''; render(allNodes);
    }
  });

  // On page load: fetch both dropdowns in parallel, then fetch nodes.
  loadDropdowns().then(() => load());
})();
</script>
</body>
</html>
