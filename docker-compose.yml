version: "3.9"

# Phase 1 local stack — runs ONLY the mcp service against Supabase Free.
# No local Postgres: dev, CI, and prod all share the same Supabase DB via SUPABASE_DB_URL.
# Migrations are an opt-in profile (one-shot sidecar against Supabase).
#
# Usage:
#   docker compose up                                       # mcp server only
#   docker compose --profile migrate run --rm migrate       # apply goose migrations to Supabase
#
# Required env var (set in .env from .env.example):
#   SUPABASE_DB_URL — full Postgres connection string with sslmode=require

services:
  mcp:
    build: .
    command: ["-transport=http", "-addr=:8080"]
    ports:
      - "8080:8080"
    environment:
      SUPABASE_DB_URL: "${SUPABASE_DB_URL:?SUPABASE_DB_URL is required — copy .env.example to .env and set it}"
      MCP_TRANSPORT: http
      MCP_HTTP_ADDR: ":8080"
      LOG_LEVEL: "${LOG_LEVEL:-info}"

  migrate:
    profiles: ["migrate"]
    build: .
    entrypoint: ["goose"]
    command:
      - "-dir=/migrations"
      - "postgres"
      - "${SUPABASE_DB_URL:?SUPABASE_DB_URL is required for migrations}"
      - "up"
    # migrations/ volume + the real /migrations directory in the image land in PR-2
    volumes: []
