version: "3.9"

# Phase 1 local stack — three services sharing the same Docker image.
# Full healthchecks, smoke-test wiring, and env var plumbing land in PR-6.
# For now this file declares the service graph and depends_on ordering so
# future PRs have a stable base to extend.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: context_harness_mcp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  migrate:
    build: .
    entrypoint: ["goose"]
    command:
      - "-dir=/migrations"
      - "postgres"
      - "${POSTGRES_DSN:-postgres://postgres:postgres@postgres:5432/context_harness_mcp?sslmode=disable}"
      - "up"
    depends_on:
      - postgres
    # migrations/ volume and real goose command land in PR-2
    volumes: []

  mcp:
    build: .
    command: ["-transport=http", "-addr=:8080"]
    ports:
      - "8080:8080"
    environment:
      POSTGRES_DSN: "${POSTGRES_DSN:-postgres://postgres:postgres@postgres:5432/context_harness_mcp?sslmode=disable}"
      MCP_TRANSPORT: http
      MCP_HTTP_ADDR: ":8080"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    depends_on:
      - migrate
