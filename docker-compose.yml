# Phase 1 local stack — runs ONLY the mcp service against any reachable Postgres.
# No local Postgres: dev, CI, and prod all share a DSN via DATABASE_URL.
# Migrations are an opt-in profile (one-shot sidecar; runs goose against the DB).
#
# Usage:
#   docker compose up -d --wait                               # mcp server (waits for healthy)
#   docker compose --profile migrate run --rm migrate         # apply goose migrations
#
# Required env var (set in .env from .env.example):
#   DATABASE_URL — full Postgres connection string with ?sslmode=require (cloud)
#                  or ?sslmode=disable (local dev)
#
# SUPABASE_DB_URL back-compat note: the binary's resolveDatabaseURL() helper
# accepts SUPABASE_DB_URL as a fallback (deprecated, one release). BUT docker
# compose itself only interpolates DATABASE_URL — there's no nested fallback
# at the compose level (nested ${X:-${Y:?error}} doesn't behave the way you'd
# expect; the inner :? evaluates even when the outer falls through). If you
# have SUPABASE_DB_URL=... in your .env, rename it to DATABASE_URL=... before
# running docker compose up.

services:
  mcp:
    build: .
    command: ["-transport=http", "-addr=:7654"]
    ports:
      - "7654:7654"
    environment:
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required — copy .env.example to .env and set it (rename SUPABASE_DB_URL → DATABASE_URL in your .env if migrating from a previous version)}"
      MCP_TRANSPORT: http
      MCP_HTTP_ADDR: ":7654"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    healthcheck:
      test: ["CMD", "curl", "-fsSL", "http://localhost:7654/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  migrate:
    profiles: ["migrate"]
    build: .
    entrypoint: ["goose"]
    command:
      - "-dir=/migrations"
      - "postgres"
      - "${DATABASE_URL:?DATABASE_URL is required for migrations}"
      - "up"
    # migrations/ is baked into the image at /migrations (see Dockerfile COPY --from=builder).
    # No host bind-mount needed — the same image works on Render and locally.
