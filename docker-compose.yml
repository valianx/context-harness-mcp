# Phase 1 local stack — runs ONLY the mcp service against any reachable Postgres.
# No local Postgres: dev, CI, and prod all share a DSN via SUPABASE_DB_URL.
# Migrations are an opt-in profile (one-shot sidecar; runs goose against the DB).
#
# Usage:
#   docker compose up -d --wait                               # mcp server (waits for healthy)
#   docker compose --profile migrate run --rm migrate         # apply goose migrations
#
# Required env var (set in .env from .env.example):
#   SUPABASE_DB_URL — full Postgres connection string

services:
  mcp:
    build: .
    command: ["-transport=http", "-addr=:7654"]
    ports:
      - "7654:7654"
    environment:
      SUPABASE_DB_URL: "${SUPABASE_DB_URL:?SUPABASE_DB_URL is required — copy .env.example to .env and set it}"
      MCP_TRANSPORT: http
      MCP_HTTP_ADDR: ":7654"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    healthcheck:
      test: ["CMD", "curl", "-fsSL", "http://localhost:7654/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  migrate:
    profiles: ["migrate"]
    build: .
    entrypoint: ["goose"]
    command:
      - "-dir=/migrations"
      - "postgres"
      - "${SUPABASE_DB_URL:?SUPABASE_DB_URL is required for migrations}"
      - "up"
    # migrations/ is baked into the image at /migrations (see Dockerfile COPY --from=builder).
    # No host bind-mount needed — the same image works on Render and locally.
