services:
  - type: web
    name: context-harness-mcp
    env: docker
    plan: free
    region: oregon
    healthCheckPath: /healthz
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Override the Dockerfile CMD (which defaults to -transport=stdio for local
    # Claude Code stdio use). On Render the server must listen on HTTP — Render
    # is a web-service host, not a stdio runner. The MCP_TRANSPORT / MCP_HTTP_ADDR
    # envVars below are kept for documentation but the binary today reads CLI
    # flags only; the dockerCommand wins.
    dockerCommand: /usr/local/bin/server -transport=http -addr=:7654
    envVars:
      - key: MCP_TRANSPORT
        value: http
      - key: MCP_HTTP_ADDR
        value: ":7654"
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false   # set manually in Render dashboard; never sourced from git
